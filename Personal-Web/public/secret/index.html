<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YC — Private</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #090909; --bg1: #0f0f12; --bg2: #16161c; --bg3: #1e1e26;
  --text: #f1f5f9; --muted: #94a3b8; --dim: #475569;
  --accent: #1d4ed8; --accent-light: #93c5fd; --accent-glow: rgba(29,78,216,0.25);
  --green: #34d399; --red: #f87171;
  --border: rgba(255,255,255,0.07);
}
body {
  font-family: 'Inter', -apple-system, sans-serif;
  background: var(--bg); color: var(--text);
  min-height: 100vh; display: flex; align-items: center; justify-content: center;
}
a { color: var(--accent-light); text-decoration: none; }
a:hover { text-decoration: underline; }

/* ── Login ── */
.login-box {
  background: var(--bg1); border: 1px solid var(--border); border-radius: 16px;
  padding: 48px 40px; width: min(420px, 90vw); text-align: center;
}
.login-box h1 { font-size: 22px; font-weight: 700; margin-bottom: 6px; }
.login-box p { color: var(--muted); font-size: 13px; margin-bottom: 28px; }
.field { margin-bottom: 16px; text-align: left; }
.field label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 6px; letter-spacing: 0.5px; }
.field input {
  width: 100%; padding: 10px 14px; background: var(--bg2); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text); font-size: 14px; outline: none;
  transition: border-color 0.2s;
}
.field input:focus { border-color: var(--accent); }
.login-btn {
  width: 100%; padding: 12px; background: linear-gradient(135deg, #1d4ed8, #1e40af);
  color: #fff; border: none; border-radius: 10px; font-size: 14px; font-weight: 600;
  cursor: pointer; margin-top: 8px; transition: opacity 0.2s;
}
.login-btn:hover { opacity: 0.88; }
.login-error { color: var(--red); font-size: 12px; margin-top: 12px; display: none; }
.login-footer { margin-top: 20px; font-size: 12px; color: var(--dim); }
.login-footer a { color: var(--accent-light); }

/* ── Dashboard ── */
.dashboard { display: none; min-height: 100vh; width: 100%; }
.dash-topbar {
  position: sticky; top: 0; background: rgba(9,9,9,0.9); backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border); padding: 14px 28px;
  display: flex; align-items: center; justify-content: space-between; z-index: 10;
}
.dash-brand { font-size: 16px; font-weight: 700; }
.dash-brand span { color: var(--accent); }
.dash-user { display: flex; align-items: center; gap: 12px; }
.dash-user-name { font-size: 13px; color: var(--muted); }
.dash-logout {
  padding: 6px 14px; background: var(--bg2); border: 1px solid var(--border);
  border-radius: 8px; color: var(--muted); font-size: 12px; cursor: pointer;
  transition: border-color 0.2s, color 0.2s;
}
.dash-logout:hover { border-color: var(--red); color: var(--red); }

.dash-content { max-width: 900px; margin: 0 auto; padding: 32px 24px 80px; }
.dash-greeting { font-size: 28px; font-weight: 700; margin-bottom: 4px; }
.dash-subtitle { color: var(--muted); font-size: 14px; margin-bottom: 32px; }

.dash-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 16px; margin-bottom: 32px; }
.dash-card {
  background: var(--bg1); border: 1px solid var(--border); border-radius: 14px;
  padding: 24px; transition: border-color 0.2s;
}
.dash-card:hover { border-color: rgba(29,78,216,0.3); }
.dash-card h3 { font-size: 14px; font-weight: 600; margin-bottom: 16px; display: flex; align-items: center; gap: 8px; }
.dash-card h3 span { font-size: 18px; }

/* Notes */
.note-area {
  width: 100%; min-height: 120px; background: var(--bg2); border: 1px solid var(--border);
  border-radius: 8px; padding: 12px; color: var(--text); font-size: 13px;
  font-family: inherit; resize: vertical; outline: none; line-height: 1.6;
}
.note-area:focus { border-color: var(--accent); }
.note-status { font-size: 11px; color: var(--dim); margin-top: 8px; }

/* Links */
.link-list { list-style: none; display: flex; flex-direction: column; gap: 8px; }
.link-item {
  display: flex; align-items: center; gap: 10px; padding: 8px 12px;
  background: var(--bg2); border-radius: 8px; font-size: 13px;
}
.link-item a { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.link-del { background: none; border: none; color: var(--dim); cursor: pointer; font-size: 14px; }
.link-del:hover { color: var(--red); }
.link-add-row { display: flex; gap: 8px; margin-top: 10px; }
.link-add-row input {
  flex: 1; padding: 8px 12px; background: var(--bg2); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text); font-size: 13px; outline: none;
}
.link-add-btn {
  padding: 8px 16px; background: var(--accent); color: #fff; border: none;
  border-radius: 8px; font-size: 13px; cursor: pointer;
}

/* Todos */
.todo-list { display: flex; flex-direction: column; gap: 6px; }
.todo-item { display: flex; align-items: center; gap: 10px; font-size: 13px; }
.todo-item input[type="checkbox"] { accent-color: var(--accent); }
.todo-item.done span { text-decoration: line-through; color: var(--dim); }
.todo-del { background: none; border: none; color: var(--dim); cursor: pointer; font-size: 12px; }
.todo-del:hover { color: var(--red); }
.todo-add-row { display: flex; gap: 8px; margin-top: 10px; }
.todo-add-row input {
  flex: 1; padding: 8px 12px; background: var(--bg2); border: 1px solid var(--border);
  border-radius: 8px; color: var(--text); font-size: 13px; outline: none;
}
.todo-add-btn {
  padding: 8px 16px; background: var(--accent); color: #fff; border: none;
  border-radius: 8px; font-size: 13px; cursor: pointer;
}

/* Quick stats */
.stat-row { display: flex; gap: 16px; flex-wrap: wrap; }
.stat-box {
  flex: 1; min-width: 100px; background: var(--bg2); border-radius: 10px;
  padding: 16px; text-align: center;
}
.stat-num { font-size: 28px; font-weight: 800; color: var(--accent-light); }
.stat-label { font-size: 11px; color: var(--dim); margin-top: 4px; letter-spacing: 0.5px; }
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>
<body>

<!-- ════════ LOGIN ════════ -->
<div class="login-box" id="loginBox">
  <h1>Private Access</h1>
  <p>This area is restricted. Please sign in.</p>
  <div class="field">
    <label>USERNAME</label>
    <input type="text" id="username" placeholder="Enter username" autocomplete="off">
  </div>
  <div class="field">
    <label>PASSWORD</label>
    <input type="password" id="password" placeholder="Enter password">
  </div>
  <button class="login-btn" id="loginBtn">Sign In</button>
  <div class="login-error" id="loginError">Incorrect username or password.</div>
  <div class="login-footer"><a href="/">← Back to portfolio</a></div>
</div>

<!-- ════════ DASHBOARD ════════ -->
<div class="dashboard" id="dashboard">
  <div class="dash-topbar">
    <div class="dash-brand">YC<span>.</span> Private</div>
    <div class="dash-user">
      <span class="dash-user-name" id="dashUser"></span>
      <button class="dash-logout" id="logoutBtn">Sign Out</button>
    </div>
  </div>

  <div class="dash-content">
    <div class="dash-greeting" id="dashGreeting">Welcome back</div>
    <div class="dash-subtitle" id="dashDate"></div>

    <!-- Stats -->
    <div class="dash-grid" style="margin-bottom:24px">
      <div class="dash-card">
        <div class="stat-row">
          <div class="stat-box"><div class="stat-num" id="statNotes">0</div><div class="stat-label">Notes</div></div>
          <div class="stat-box"><div class="stat-num" id="statLinks">0</div><div class="stat-label">Links</div></div>
          <div class="stat-box"><div class="stat-num" id="statTodos">0</div><div class="stat-label">Todos</div></div>
        </div>
      </div>
    </div>

    <div class="dash-grid">
      <!-- Notes -->
      <div class="dash-card">
        <h3><span>📝</span> Quick Notes</h3>
        <textarea class="note-area" id="noteArea" placeholder="Write anything here..."></textarea>
        <div class="note-status" id="noteStatus">Auto-saved</div>
      </div>

      <!-- Links -->
      <div class="dash-card">
        <h3><span>🔗</span> Saved Links</h3>
        <ul class="link-list" id="linkList"></ul>
        <div class="link-add-row">
          <input type="text" id="linkInput" placeholder="Paste a URL...">
          <button class="link-add-btn" id="linkAddBtn">+</button>
        </div>
      </div>

      <!-- Todos -->
      <div class="dash-card">
        <h3><span>✅</span> To-Do</h3>
        <div class="todo-list" id="todoList"></div>
        <div class="todo-add-row">
          <input type="text" id="todoInput" placeholder="Add a task...">
          <button class="todo-add-btn" id="todoAddBtn">+</button>
        </div>
      </div>

      <!-- Secrets -->
      <div class="dash-card">
        <h3><span>🔒</span> Encrypted Vault</h3>
        <textarea class="note-area" id="vaultArea" placeholder="Store sensitive info here... (encrypted with your password)"></textarea>
        <div class="note-status" id="vaultStatus">Encrypted & auto-saved</div>
      </div>
    </div>
  </div>
</div>

<script>
// ══════════════════════════════════
//  CONFIG — Change these to set your credentials
// ══════════════════════════════════
// To change credentials: replace the hash values below.
// Generate new hashes at: browser console →
//   crypto.subtle.digest('SHA-256', new TextEncoder().encode('your-username:your-password'))
//     .then(h => btoa(String.fromCharCode(...new Uint8Array(h))))
//     .then(console.log)
//
// Default: username = "chianghebe" / password = "Hebe07222"
const CREDENTIAL_HASH = "nYiRQEf6BKPuyiH5poJwDRdpoYPcB6qyhzWhtIxmHck=";

// ══════════════════════════════════
//  CRYPTO UTILS
// ══════════════════════════════════
async function sha256(str) {
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(str));
  return btoa(String.fromCharCode(...new Uint8Array(buf)));
}

async function deriveKey(password) {
  const enc = new TextEncoder().encode(password);
  const keyMaterial = await crypto.subtle.importKey("raw", enc, "PBKDF2", false, ["deriveKey"]);
  return crypto.subtle.deriveKey(
    { name: "PBKDF2", salt: new TextEncoder().encode("yc-secret-salt-2024"), iterations: 100000, hash: "SHA-256" },
    keyMaterial, { name: "AES-GCM", length: 256 }, false, ["encrypt", "decrypt"]
  );
}

async function encrypt(text, password) {
  const key = await deriveKey(password);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt({ name: "AES-GCM", iv }, key, new TextEncoder().encode(text));
  const combined = new Uint8Array(iv.length + new Uint8Array(ct).length);
  combined.set(iv); combined.set(new Uint8Array(ct), iv.length);
  return btoa(String.fromCharCode(...combined));
}

async function decrypt(b64, password) {
  try {
    const key = await deriveKey(password);
    const data = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
    const iv = data.slice(0, 12);
    const ct = data.slice(12);
    const pt = await crypto.subtle.decrypt({ name: "AES-GCM", iv }, key, ct);
    return new TextDecoder().decode(pt);
  } catch { return null; }
}

// ══════════════════════════════════
//  AUTH
// ══════════════════════════════════
let currentPassword = "";

async function login() {
  const user = document.getElementById("username").value.trim();
  const pass = document.getElementById("password").value;
  const hash = await sha256(user + ":" + pass);

  if (hash !== CREDENTIAL_HASH) {
    document.getElementById("loginError").style.display = "block";
    return;
  }

  currentPassword = pass;
  sessionStorage.setItem("yc_auth", hash);
  sessionStorage.setItem("yc_user", user);
  sessionStorage.setItem("yc_pass", pass);
  showDashboard(user);
}

function logout() {
  sessionStorage.clear();
  currentPassword = "";
  document.getElementById("dashboard").style.display = "none";
  document.getElementById("loginBox").style.display = "block";
  document.body.style.alignItems = "center";
  document.getElementById("password").value = "";
  document.getElementById("loginError").style.display = "none";
}

async function checkSession() {
  const hash = sessionStorage.getItem("yc_auth");
  const user = sessionStorage.getItem("yc_user");
  const pass = sessionStorage.getItem("yc_pass");
  if (hash === CREDENTIAL_HASH && user && pass) {
    currentPassword = pass;
    showDashboard(user);
  }
}

// ══════════════════════════════════
//  DASHBOARD
// ══════════════════════════════════
async function showDashboard(user) {
  document.getElementById("loginBox").style.display = "none";
  document.getElementById("dashboard").style.display = "block";
  document.body.style.alignItems = "stretch";
  document.getElementById("dashUser").textContent = user;
  document.getElementById("dashGreeting").textContent = `Welcome back, ${user}`;
  document.getElementById("dashDate").textContent = new Date().toLocaleDateString("en-GB", { weekday: "long", year: "numeric", month: "long", day: "numeric" });

  await loadNotes();
  await loadLinks();
  await loadTodos();
  await loadVault();
  updateStats();
}

// ── Notes ──
async function loadNotes() {
  const raw = localStorage.getItem("yc_notes");
  if (raw) {
    const text = await decrypt(raw, currentPassword);
    if (text !== null) document.getElementById("noteArea").value = text;
  }
}
async function saveNotes() {
  const text = document.getElementById("noteArea").value;
  const enc = await encrypt(text, currentPassword);
  localStorage.setItem("yc_notes", enc);
  document.getElementById("noteStatus").textContent = "Saved " + new Date().toLocaleTimeString();
  updateStats();
}

// ── Vault ──
async function loadVault() {
  const raw = localStorage.getItem("yc_vault");
  if (raw) {
    const text = await decrypt(raw, currentPassword);
    if (text !== null) document.getElementById("vaultArea").value = text;
  }
}
async function saveVault() {
  const text = document.getElementById("vaultArea").value;
  const enc = await encrypt(text, currentPassword);
  localStorage.setItem("yc_vault", enc);
  document.getElementById("vaultStatus").textContent = "Encrypted & saved " + new Date().toLocaleTimeString();
}

// ── Links ──
let links = [];
async function loadLinks() {
  const raw = localStorage.getItem("yc_links");
  if (raw) {
    const text = await decrypt(raw, currentPassword);
    if (text) links = JSON.parse(text);
  }
  renderLinks();
}
async function saveLinks() {
  const enc = await encrypt(JSON.stringify(links), currentPassword);
  localStorage.setItem("yc_links", enc);
  updateStats();
}
function renderLinks() {
  const list = document.getElementById("linkList");
  list.innerHTML = links.map((l, i) =>
    `<li class="link-item"><a href="${l}" target="_blank" rel="noreferrer">${l}</a><button class="link-del" onclick="removeLink(${i})">✕</button></li>`
  ).join("");
}
function addLink() {
  const input = document.getElementById("linkInput");
  const url = input.value.trim();
  if (!url) return;
  links.push(url);
  input.value = "";
  renderLinks();
  saveLinks();
}
function removeLink(i) {
  links.splice(i, 1);
  renderLinks();
  saveLinks();
}

// ── Todos ──
let todos = [];
async function loadTodos() {
  const raw = localStorage.getItem("yc_todos");
  if (raw) {
    const text = await decrypt(raw, currentPassword);
    if (text) todos = JSON.parse(text);
  }
  renderTodos();
}
async function saveTodos() {
  const enc = await encrypt(JSON.stringify(todos), currentPassword);
  localStorage.setItem("yc_todos", enc);
  updateStats();
}
function renderTodos() {
  const list = document.getElementById("todoList");
  list.innerHTML = todos.map((t, i) =>
    `<div class="todo-item${t.done ? " done" : ""}">
      <input type="checkbox" ${t.done ? "checked" : ""} onchange="toggleTodo(${i})">
      <span>${t.text}</span>
      <button class="todo-del" onclick="removeTodo(${i})">✕</button>
    </div>`
  ).join("");
}
function addTodo() {
  const input = document.getElementById("todoInput");
  const text = input.value.trim();
  if (!text) return;
  todos.push({ text, done: false });
  input.value = "";
  renderTodos();
  saveTodos();
}
function toggleTodo(i) { todos[i].done = !todos[i].done; renderTodos(); saveTodos(); }
function removeTodo(i) { todos.splice(i, 1); renderTodos(); saveTodos(); }

function updateStats() {
  document.getElementById("statNotes").textContent = document.getElementById("noteArea").value.length > 0 ? "1" : "0";
  document.getElementById("statLinks").textContent = links.length;
  document.getElementById("statTodos").textContent = todos.length;
}

// ══════════════════════════════════
//  INIT
// ══════════════════════════════════
document.getElementById("loginBtn").addEventListener("click", login);
document.getElementById("password").addEventListener("keydown", e => { if (e.key === "Enter") login(); });
document.getElementById("logoutBtn").addEventListener("click", logout);

let noteTimer, vaultTimer;
document.getElementById("noteArea").addEventListener("input", () => { clearTimeout(noteTimer); noteTimer = setTimeout(saveNotes, 500); });
document.getElementById("vaultArea").addEventListener("input", () => { clearTimeout(vaultTimer); vaultTimer = setTimeout(saveVault, 500); });
document.getElementById("linkAddBtn").addEventListener("click", addLink);
document.getElementById("linkInput").addEventListener("keydown", e => { if (e.key === "Enter") addLink(); });
document.getElementById("todoAddBtn").addEventListener("click", addTodo);
document.getElementById("todoInput").addEventListener("keydown", e => { if (e.key === "Enter") addTodo(); });

checkSession();
</script>
</body>
</html>
